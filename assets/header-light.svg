<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220" role="img" aria-label="Cauan Melo, Desenvolvedor Full Stack">
<defs>
<linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#0969da"/><stop offset="1" stop-color="#1a7f37"/></linearGradient>
</defs>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
.name{font-size:54px;font-weight:700;letter-spacing:-1.5px;fill:#1f2328;opacity:0;animation:up 1s .15s cubic-bezier(.2,.7,.2,1) forwards}
.ph{font-size:24px;font-weight:500;fill:#656d76;opacity:0}
.tag{font-family:ui-monospace,SFMono-Regular,Consolas,'Liberation Mono',monospace;font-size:13px;fill:#656d76;opacity:0;animation:fade 1s 1s forwards}
.line{stroke:url(#g);stroke-width:3;stroke-linecap:round;stroke-dasharray:120;stroke-dashoffset:120;animation:draw 1.2s .5s cubic-bezier(.2,.7,.2,1) forwards}
.dot{fill:#0969da;opacity:.0;animation:float 7s ease-in-out infinite}
.cur{fill:url(#g);animation:blink 1.1s steps(1) infinite}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes fade{to{opacity:.9}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes blink{50%{opacity:0}}
@keyframes float{0%,100%{opacity:.05;transform:translateY(0)}50%{opacity:.22;transform:translateY(-12px)}}
@keyframes p0{0%,0.00%{opacity:0;transform:translateY(6px)}2.00%,23.00%{opacity:1;transform:translateY(0)}25.00%,100%{opacity:0;transform:translateY(-6px)}}@keyframes p1{0%,25.00%{opacity:0;transform:translateY(6px)}27.00%,48.00%{opacity:1;transform:translateY(0)}50.00%,100%{opacity:0;transform:translateY(-6px)}}@keyframes p2{0%,50.00%{opacity:0;transform:translateY(6px)}52.00%,73.00%{opacity:1;transform:translateY(0)}75.00%,100%{opacity:0;transform:translateY(-6px)}}@keyframes p3{0%,75.00%{opacity:0;transform:translateY(6px)}77.00%,98.00%{opacity:1;transform:translateY(0)}100.00%,100%{opacity:0;transform:translateY(-6px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.name,.tag{opacity:1}.line{stroke-dashoffset:0}.ph.f{opacity:1}}
</style>
<circle class="dot" cx="760" cy="60" r="5" style="animation-delay:0s"/>
<circle class="dot" cx="820" cy="120" r="3.5" style="animation-delay:1.4s"/>
<circle class="dot" cx="700" cy="150" r="4" style="animation-delay:2.8s"/>
<circle class="dot" cx="850" cy="40" r="2.5" style="animation-delay:4.2s"/>
<text class="name" x="58" y="95">Cauan Melo</text>
<line class="line" x1="60" y1="112" x2="180" y2="112"/>
<text class="ph f" style="animation:p0 12.0s ease-in-out infinite" x="60" y="150">Desenvolvedor Full Stack</text><text class="ph" style="animation:p1 12.0s ease-in-out infinite" x="60" y="150">Python  ·  FastAPI</text><text class="ph" style="animation:p2 12.0s ease-in-out infinite" x="60" y="150">PHP  ·  Laravel</text><text class="ph" style="animation:p3 12.0s ease-in-out infinite" x="60" y="150">React  ·  TypeScript</text>
<rect class="cur" x="60" y="172" width="8" height="2"/>
<text class="tag" x="76" y="177">remoto · Maceió/AL</text>
</svg>
